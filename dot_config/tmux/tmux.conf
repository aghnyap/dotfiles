# ╭──────────────────────────────────────────────────────────────────────────╮
# │  tmux -- persistent per-project sessions                                 │
# │                                                                          │
# │  Division of labour with Ghostty: Ghostty's native splits are for        │
# │  throwaway panes; tmux owns named sessions that survive a terminal       │
# │  restart, a reboot, and SSH.                                             │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ── Terminal / colour ───────────────────────────────────────────────────────
# tmux advertises itself as tmux-256color inside the session, and is told that
# the OUTER terminal (Ghostty) supports 24-bit colour and undercurls. Without
# the RGB flag, Neovim's truecolor themes degrade to 256 colours inside tmux.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set  -as terminal-features  ",xterm-ghostty:RGB:usstyle"
# Undercurl + coloured underlines (used by LSP diagnostics in Neovim)
set  -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set  -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Extended keys ───────────────────────────────────────────────────────────
# Neovim asks for the kitty keyboard protocol; these let tmux answer it and
# pass modified keys through as CSI-u rather than the lossy legacy encoding.
# `extended-keys-format` defaults to `xterm` (modifyOtherKeys), which cannot
# express Shift on a printable key -- measured: with csi-u, \E[112;6u reaches
# Neovim intact as <C-S-P>; without it, it does not.
set  -s  extended-keys on
set  -s  extended-keys-format csi-u
set  -as terminal-features ",xterm-ghostty:extkeys"

# The Cmd chords DO survive tmux, and the two settings above are why -- this is
# the fix, not a workaround. Kept as a note because the failure it replaced looked
# unfixable: Ghostty used to encode the chords with the Super bit (\E[112;9u =
# Cmd+P), tmux's key model has no Super modifier so it collapsed Super onto Meta,
# a pane received a bare <M-p>, and tmux's own CSI-u parser ate the sequence
# before `user-keys` could match it. Every <D-...> mapping was dead inside a pane.
#
# The escape was to re-encode onto a modifier combination tmux can carry: Ghostty
# now sends Ctrl+Shift (\E[112;6u) and Ctrl+Alt+Shift, and Neovim aliases those
# back to <D-...>. Both halves are required -- see the derivation in
# ~/.config/ghostty/config and the alias table in lua/config/keymaps.lua.

# ── Core behaviour ──────────────────────────────────────────────────────────
# escape-time 0 is essential: any delay here makes <Esc> laggy in Neovim.
set  -sg escape-time 0
set  -g  focus-events on          # lets Neovim's autoread/checktime fire
set  -g  history-limit 100000
set  -g  mouse on
set  -g  base-index 1             # windows start at 1; 0 is a long reach
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  set-clipboard on
set  -g  display-time 2000
set  -g  status-interval 5
set  -g  detach-on-destroy off    # jump to another session instead of exiting
setw -g  aggressive-resize on

# ── Prefix ──────────────────────────────────────────────────────────────────
# C-a instead of C-b: C-b is readline's backward-char and is used constantly.
# C-a is readline's beginning-of-line -- still reachable as prefix + a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a   send-prefix

# ── Reload ──────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display " tmux.conf reloaded"

# ── Splits and windows ──────────────────────────────────────────────────────
# | and - are mnemonic for the resulting divider. All inherit the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation: vim-tmux-navigator ─────────────────────────────────────
# Ctrl-hjkl moves between tmux panes AND Neovim splits with no prefix and no
# mode change. The plugin detects whether the focused pane is running Neovim
# and forwards the key instead of switching panes.
# (Bindings come from the plugin; listed here so the intent is discoverable.)
#
# `cha` is added to that detection list because chawan binds C-l to the
# location bar and C-k to web search. Without this the plugin sees a non-vim
# pane and switches panes instead, so those two keys never reach the browser
# and the address bar is simply unreachable. The default pattern is copied
# from the plugin verbatim with `|cha` appended -- keep it in sync if the
# plugin's own default changes.
#
# Trade-off: while chawan is focused, C-hjkl belongs to the browser, so leave
# the pane with the prefix (`prefix + o`, or prefix + arrow) instead.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|cha)(diff)?(-wrapped)?'

# Resize with prefix + HJKL, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z          # zoom toggle

# Window switching
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# ── Copy mode (vi) ──────────────────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v          send -X begin-selection
bind -T copy-mode-vi C-v        send -X rectangle-toggle
bind -T copy-mode-vi y          send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape     send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Sessions ────────────────────────────────────────────────────────────────
# sesh: fuzzy switcher across live sessions, zoxide directories and configured
# projects. This is what makes per-project sessions practical.
bind o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""
bind -N "last session" Space switch-client -l
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# ── Project layouts ─────────────────────────────────────────────────────────
# prefix + P opens the layout picker; see ~/.config/tmux/layouts/.
bind P run-shell "~/.config/tmux/layouts/pick.sh"

# ── Plugins (tpm) ───────────────────────────────────────────────────────────
# Install/update with prefix + I / prefix + U.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# resurrect: also restore pane contents and running programs
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# continuum: autosave every 15 min and restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tokyo-night-tmux statusline
set -g @tokyo-night-tmux_window_id_style 'none'
set -g @tokyo-night-tmux_pane_id_style   'hide'
set -g @tokyo-night-tmux_zoom_id_style   'dsquare'
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format 'MYD'
set -g @tokyo-night-tmux_time_format '24H'
set -g @tokyo-night-tmux_show_git 0        # lazygit/starship already cover git
set -g @tokyo-night-tmux_show_battery_widget 1

# fzf-url: prefix + u to open any URL visible in the pane
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'

# Keep this last -- tpm sources the plugins and must see every @plugin above.
run '~/.config/tmux/plugins/tpm/tpm'
