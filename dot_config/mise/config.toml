# The single source of truth for the global runtime versions. The installer
# script (run_onchange_before_install-packages.sh.tmpl) inlines this file and
# runs `mise install` against it, so the pins are not repeated there.
#
# java is pinned, not merely installed. It used to be `mise install
# java@temurin-21` in the installer with no pin, which left the runtime present
# but inactive -- `mise which java` reported "not currently active" -- so the
# shim fell through to whatever else was on PATH. On this machine that happened
# to be a SDKMAN JetBrains Runtime; on a fresh Mac it is /usr/bin/java, the macOS
# stub that exists and then refuses to run, which breaks Gradle and jdtls.
#
# 17 rather than 21: it is what the Android/Gradle work here targets.
[tools]
node = "22"
java = "temurin-17"
# Added for the v12.0-audited manifest's Go/Rust/Python runtime coverage.
# No existing workflow in this repo pins a more specific version yet -- these
# are mise's own "latest stable" aliases, not hand-picked like the pins
# above. Tighten to an exact version here the day something actually needs
# one (a go.mod toolchain directive, a rust-toolchain.toml, a project's
# pyproject.toml requires-python).
go = "latest"
rust = "stable"
python = "3.12"

# No global `ruby` any more. It existed only for cocoapods/fastlane, which
# moved to Brewfile.optional's `mobile` group in the v12.0-audited
# migration -- pinning a ruby every machine builds (compiling one from
# source is exactly what stalled `mise install` on Ubuntu without libssl/
# libyaml/zlib dev headers, under this installer's `set -e`) to serve two
# now-opt-in gems stopped making sense. `mise use ruby@3.3.5` in a project
# that actually uses cocoapods/fastlane is the replacement -- 3.3.5 because
# that is what those gems on this machine were built against, same reason
# the old global pin gave for it.
