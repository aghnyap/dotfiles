"$schema" = 'https://starship.rs/config-schema.json'

# ╭──────────────────────────────────────────────────────────────────────────╮
# │  Intentionally empty: starship's built-in defaults.                      │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# The default format is the one with the connecting words:
#
#   repo-name on  branch [!] via ☕ v17.0.12 took 4s
#   ❯
#
# starship applies its defaults for anything a config does not set, so an
# empty file and no file behave identically. The file is kept (rather than
# deleted) so it stays managed by chezmoi and there is somewhere obvious to put
# an override later.
#
# Note the defaults use emoji for language symbols (☕ 🐳 🅺), not Nerd Font
# glyphs. That is deliberate upstream -- it renders in any font. Overriding a
# single `symbol` is enough to switch one back to a Nerd Font glyph.
#
# A two-line Tokyo Night powerline config used to live here, kept as a FILE
# rather than in git history. History here gets rewritten and
# squashed, so a comment pointing at a commit is a promise this repo cannot keep
# -- which already happened once, when a scrub changed every SHA and left the
# hash written here pointing at nothing.
#
#   cp ~/dotfiles/starship-powerline.toml ~/dotfiles/dot_config/starship.toml
#   chezmoi apply ~/.config/starship.toml
#
# If you do re-customise: `palette = "..."` must appear ABOVE the
# `[palettes.<name>]` table, or TOML scopes it into that table and it silently
# does nothing. See the note in README.md.

# ── The overrides ───────────────────────────────────────────────────────────
# git_branch keeps starship's default symbol, U+E0A0 (pl-branch), on purpose.
#
# It was briefly overridden to U+F062C (md-source_branch) because U+E0A0 is a
# thin two-pixel mark that reads as almost blank at font-size 14. That traded a
# legibility nit for a portability bug:
#
#   U+E0A0   BMP, original powerline range. Present in every powerline-patched
#            and Nerd-patched font, and in several terminals' own fallback.
#            Renders everywhere.
#   U+F062C  plane 15, Nerd Fonts *v3* Material Design range (v2 put these at
#            U+F5xx). Needs a v3-patched font specifically, and astral-plane
#            private use gets no system font fallback -- so anything not
#            already rendering in the patched font shows tofu or nothing.
#
# Only Ghostty is configured to JetBrainsMono Nerd Font here, so the override
# looked correct in the one terminal it was checked in and broke in the rest.
# The prompt is the wrong place to spend portability on: it is the one piece of
# config that has to survive every terminal, every ssh session and every
# screen-recording tool. If the default is too faint, raise the font size or
# recolour the module -- both stay inside the BMP.
#
# The general rule, and the reason this comment is long: the nf-md range being
# *reliable* and being *portable* are different claims. See the Nerd Fonts
# gotcha in CLAUDE.md.

# gcloud off. Its default format leads with the active account, so every prompt
# in every window rendered a work email address:
#
#   /tmp on ☁️  someone@employer.example
#
# That is on screen in every screenshot, screen share and recording. The obvious
# fix is to reformat the module to show region or project instead -- but on this
# machine `gcloud config` has no project, region or zone set at all. Account is
# the only value it has, so the identifying part is the only part it could ever
# display, and reformatting would leave a decorative empty cloud.
#
# Turn it back on with a format that omits $account if you start setting a
# region: format = 'on [$symbol$region]($style) '
[gcloud]
disabled = true
