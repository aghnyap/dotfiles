# Per-model settings for aider. Read from $HOME, the lowest-priority location
# aider searches (home -> git repo root -> cwd), so a project can override any of
# this with its own file.
#
# No credentials here either -- this file only describes models.
#
# ── Why this file exists at all ──────────────────────────────────────────────
# Two settings below are the difference between a local model that works and one
# that appears to work while producing nonsense.
#
# num_ctx. From aider's docs: "Ollama uses a 2k context window by default, which
# is very small for working with aider. It also silently discards context that
# exceeds the window... many users don't even realize that most of their data is
# being discarded by Ollama." Recent aider tries to size the window per request,
# but that detection is known to fall back to generic defaults (aider issue
# #1380), and the failure is invisible -- you get worse edits, not an error.
#
# The other documented fix, OLLAMA_CONTEXT_LENGTH, is NOT used here on purpose.
# It is read by the server process, and `brew services` starts ollama through
# launchd, which does not inherit a shell's environment. Exporting it from
# ~/.zshenv would look correct and do nothing. Setting num_ctx here travels with
# the request instead, so it works no matter how the server was started.
#
# These windows are shared with Neovim. Every num_ctx below matches the CONTEXT
# table in dot_config/nvim/lua/util/ai_model.lua. Neovim picks a model from
# total RAM and passes `--model ollama_chat/<tag>`, but the window still comes
# from this file, so the two have to agree -- otherwise an editor session gets a
# different context than the same model gets from the shell. Change one, change
# the other.
#
# edit_format: whole. Aider defaults unfamiliar models to `whole` because it is
# the easiest format for a model to produce correctly -- it returns the entire
# file rather than a search/replace block that has to match byte-for-byte. Its
# own troubleshooting page says to switch to `whole` when edits fail. The
# numbers back it up: Qwen2.5-Coder-32B scores 8.0% with diff and 16.4% with
# whole on aider's polyglot benchmark. The format is worth more than the model
# size here.

- name: ollama_chat/qwen2.5-coder:7b
  edit_format: whole
  # Aider turns the repo map off for models it does not recognise. It is worth
  # having on: without it the model cannot see anything outside the files you
  # added, and it guesses at names it has never been shown.
  use_repo_map: true
  extra_params:
    # 16k. `whole` sends entire files, so the window fills faster than it would
    # with diffs -- but a 7B's KV cache at 16k is only ~0.5 GB, small enough to
    # stay well inside the GPU's share of unified memory anywhere. Neovim makes
    # this the default on a 16 GB M3 Air and the toggle target on 32 GB.
    num_ctx: 16384

- name: ollama_chat/qwen2.5-coder:14b
  edit_format: whole
  use_repo_map: true
  extra_params:
    # 8k, not 16k. The 16 GB M3 Air is the only machine that selects the 14b,
    # and 9 GB of weights plus a 16k cache exceeds that machine's ~10.5 GB
    # ceiling outright. At 8k it lands near 10.2 GB -- it fits, barely.
    num_ctx: 8192

- name: ollama_chat/qwen3-coder:30b
  edit_format: whole
  use_repo_map: true
  extra_params:
    # qwen3-coder:30b is a 19 GB MoE, the Neovim default on 32 GB machines. 16k
    # keeps weights plus KV cache near 19.8 GB, under the ~21.3 GB the GPU gets
    # by default; 32k adds another 0.8 GB and leaves nothing spare.
    num_ctx: 16384

# ── Adding another model ─────────────────────────────────────────────────────
#
#   1. ollama pull gpt-oss:20b
#   2. add a block above (the name must match the tag exactly)
#   3. aider --model ollama_chat/gpt-oss:20b            # try it for a session
#
# Keep it by pointing `model:` in ~/.aider.conf.yml at it and running
# `chezmoi apply`; drop it with `ollama rm <tag>`. If Neovim should be able to
# select it too, add it to both tables in
# dot_config/nvim/lua/util/ai_model.lua.
#
# Keep edit_format: whole for anything in this size class. Raise num_ctx only if
# you have the memory to spare -- the KV cache scales with it, and a context
# that no longer fits in the GPU's share spills to CPU and gets far slower.
#
# Sizes are from the registry manifests. Only the 7b speed is measured -- on an
# M1 Pro, warm: 21.1 and 23.2 tok/s over two runs, and a real aider edit (one-line
# fix, small file) took 23s end to end. The rest are scaled from published
# benchmarks for models that were never pulled here, so treat them as an order of
# magnitude. `whole` format re-sends the entire file, so time tracks file size
# rather than the size of the change. Halve every figure on an M3 Air: token
# generation is bandwidth-bound and the Air has 100 GB/s against the Pro's 200,
# with no fan to hold the clock up over a long session.
#
#   qwen2.5-coder:7b    4.7 GB   ~22 tok/s     23 s measured      (shell default;
#                                              Neovim's default on a 16 GB Air)
#   qwen2.5-coder:14b   9.0 GB   ~15-20 tok/s  45-70 s per edit   best published;
#                                              Neovim's toggle target on 16 GB
#   gpt-oss:20b        13.8 GB   ~14b speed    Apache 2.0, MoE; unverified
#                                              against aider's edit parsing
#   qwen3-coder:30b    19.0 GB   unmeasured    MoE; Neovim's default on 32 GB,
#                                              16k context to protect memory
#   qwen2.5-coder:32b  19.9 GB   ~8-10 tok/s   1.5-2 min per edit -- NOT worth
#                                              it: scores below the 14b and sits
#                                              at this machine's Metal ceiling
#
# Do not use `codestral`. The tag Ollama serves is under the Mistral AI
# Non-Production License, which forbids commercial use -- including internal use
# at work -- without a paid agreement.
