# Aider defaults for this machine. Read from $HOME, which is the lowest-priority
# location aider searches: home -> git repo root -> cwd, later wins. So anything
# here is a default a project can override by dropping its own .aider.conf.yml,
# which is the right way round.
#
# NO CREDENTIALS IN THIS FILE. It is committed.

# There is deliberately no model default. Inside Neovim, choose one for that
# process with :AiModel before opening nvim-aider. At a shell, make the same
# human decision explicitly:
#
#   aider --model ollama_chat/qwen2.5-coder:7b
#
# `ollama_chat/`, not `ollama/`: aider's docs say plainly "Using ollama_chat/ is
# recommended over ollama/". The two are different litellm providers and the
# chat one matches how aider frames requests.
#
# Be realistic about what this is. On aider's own polyglot leaderboard Claude
# Sonnet 4 scores 56.4% and the best locally-runnable coder manages 8-16%.
# Single-file, conventional edits are usually fine; multi-file or cross-language
# work fails noticeably more often. That is the trade for free and offline, and
# it is not something configuration can tune away.
#
# Model tuning lives in ~/.aider.model.settings.yml and
# ~/.aider.model.metadata.json, not here -- request context, prompt/output
# budgets and edit format are per-model.

# Do not commit on aider's behalf.
#
# aider auto-commits every edit by default, which is a reasonable default for
# people who use it as the primary driver and a bad one here: it would write
# commits into a repo mid-session under whatever identity git resolves to, and
# review-before-commit is the whole point of the workflow this config is built
# around. /commit when you actually want one.
auto-commits: false

# Keep aider's own droppings out of whatever repo it runs in. This makes it
# offer to append `.aider*` to that project's .gitignore -- it writes
# .aider.input.history, .aider.chat.history.md and a .aider.tags.cache.v* symbol
# cache into the repo root, none of which belong in version control.
gitignore: true

# Dark, to match every other terminal tool here.
dark-mode: true

# Show the diff of what it changed. Without this you are trusting a summary.
show-diffs: true
